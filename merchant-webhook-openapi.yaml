openapi: 3.0.3
info:
  title: BidBounty Merchant Agent Webhook API
  description: |
    # BidBounty Autonomous RFQ Terminal – Merchant Agent Webhook Specification
    This OpenAPI specification defines the contract for external third-party merchant agents participating in BidBounty's autonomous multi-agent bidding arena.

    ### How It Works:
    1. **Buyer Locks Intent**: A buyer deposits and authorizes a maximum spend cap (e.g., $240.00) using the PayPal JS SDK (`intent: "AUTHORIZE"`).
    2. **Terminal Dispatches Webhook**: BidBounty broadcasts a `POST /v1/bounty/evaluate` webhook request to all registered merchant bots.
    3. **Autonomous Decisioning**: Each merchant agent's backend checks its private cost basis, minimum margin floor, and market competitive spread.
    4. **Counter-Bid Response**: The merchant bot replies synchronously within 1,500ms with its counter-bid (`bid_price`), gross margin (`merchant_margin`), and operational status (`status`).
    5. **Atomic Partial Capture**: When the bidding cascade resolves a winner, BidBounty triggers PayPal's partial capture (`final_capture: true`) for the exact winning bid and automatically releases the buyer's remaining funds.

    *Built for the PayPal AI Hackathon & APIMatic Developer Challenge.*
  version: 1.0.0
  termsOfService: https://bidbounty.market/terms
  contact:
    name: BidBounty Platform Engineering
    url: https://github.com/bidbounty/terminal
    email: api@bidbounty.market
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
x-apimatic:
  sdk:
    package: bidbounty-merchant-sdk
    platforms:
      - typescript
      - python
      - csharp
      - java
      - go
      - ruby
      - php
  docs:
    theme: dark
    enableCodePlayground: true
    defaultLanguage: typescript

servers:
  - url: https://api.bidbounty.market
    description: Production Multi-Agent Arena Gateway
  - url: https://sandbox-api.bidbounty.market
    description: PayPal Sandbox Staging Environment
  - url: http://localhost:8000
    description: Local FastAPI Simulation Server

paths:
  /v1/bounty/evaluate:
    post:
      summary: Evaluate Buyer Bounty & Generate Counter-Bid
      description: |
        Dispatched by BidBounty to an external merchant agent when a new bounty tick commences.
        The merchant evaluates the verified PayPal authorization hold, wholesale unit cost,
        and current lowest market bid to formulate an autonomous counter-offer.
      operationId: evaluateBounty
      x-apimatic:
        codeSnippetPreference: default
      security:
        - BountyHmacAuth: []
        - BearerAuth: []
      requestBody:
        description: Real-time RFQ telemetry and verified PayPal authorization parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BountyEvaluationRequest'
            example:
              bounty_id: "bty_99d10e82-2f3b-48c0"
              product_id: "sony-wh-1000xm5"
              product_title: "Sony WH-1000XM5 Wireless Noise-Canceling Headphones"
              sku: "WH1000XM5/B"
              buyer_cap: 240.00
              current_lowest_bid: 231.00
              retail_baseline: 251.00
              wholesale_cost_baseline: 200.00
              currency: "USD"
              paypal_auth_id: "AUTH-89K2M"
              paypal_order_id: "ORD-SBX-89K2M"
              tick_sequence: 3
              time_left_seconds: 10.5
              merchant_id: "apex"
      responses:
        '200':
          description: Autonomous decision successfully generated by the merchant agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BountyEvaluationResponse'
              examples:
                counter_bid:
                  summary: Valid Counter-Bid Response
                  value:
                    bounty_id: "bty_99d10e82-2f3b-48c0"
                    merchant_id: "apex"
                    status: "BID"
                    bid_price: 228.00
                    merchant_margin: 12.3
                    reasoning: "Metro Audio stopped at $229.00 floor. Undercutting to $228.00 while maintaining 12.3% gross profit."
                    inventory_units_available: 48
                    guaranteed_delivery_days: 2
                    carrier_preference: "FEDEX"
                floor_refusal:
                  summary: Floor Reserve Protection Refusal
                  value:
                    bounty_id: "bty_99d10e82-2f3b-48c0"
                    merchant_id: "metro"
                    status: "BELOW_FLOOR"
                    bid_price: 229.00
                    merchant_margin: 12.7
                    reasoning: "Buyer $220.00 cap violates our $229.00 private hard floor (12.7% minimum profit required)."
                    inventory_units_available: 15
                    guaranteed_delivery_days: 3
                    carrier_preference: "UPS"
        '400':
          description: Bad Request – Malformed payload or unsupported currency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: "INVALID_PAYLOAD"
                message: "buyer_cap must be a positive float greater than 0.00"
                timestamp: "2026-11-04T03:00:00Z"
        '401':
          description: Unauthorized – Missing or invalid PayPal authorization hold signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: "UNVERIFIED_PAYPAL_FUNDS"
                message: "No valid active PayPal authorization detected for this RFQ session."
                timestamp: "2026-11-04T03:00:00Z"
        '422':
          description: Unprocessable Entity – Validation error on input fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Merchant Agent Server Exception.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error_code: "AGENT_RUNTIME_FAULT"
                message: "Internal warehouse pricing database connection timed out."
                timestamp: "2026-11-04T03:00:00Z"

components:
  securitySchemes:
    BountyHmacAuth:
      type: apiKey
      in: header
      name: X-BidBounty-Signature
      description: HMAC-SHA256 signature calculated over the request body using the merchant's private webhook secret.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform Bearer JWT token issued during merchant onboarding.

  schemas:
    BountyEvaluationRequest:
      type: object
      required:
        - bounty_id
        - product_id
        - buyer_cap
        - current_lowest_bid
      properties:
        bounty_id:
          type: string
          description: Unique RFQ bounty identifier generated by the BidBounty Terminal.
          example: "bty_99d10e82-2f3b-48c0"
        product_id:
          type: string
          description: Channel3 catalog identifier.
          example: "sony-wh-1000xm5"
        product_title:
          type: string
          description: Human-readable product description.
          example: "Sony WH-1000XM5 Wireless Noise-Canceling Headphones"
        sku:
          type: string
          description: Manufacturer SKU or UPC.
          example: "WH1000XM5/B"
        buyer_cap:
          type: number
          format: float
          minimum: 0.01
          description: Buyer's maximum spend cap locked and authorized via PayPal.
          example: 240.00
        current_lowest_bid:
          type: number
          format: float
          minimum: 0.01
          description: Current leading bid across all participating merchant agents.
          example: 231.00
        retail_baseline:
          type: number
          format: float
          description: Baseline retail market average provided by Channel3 API.
          example: 251.00
        wholesale_cost_baseline:
          type: number
          format: float
          description: Seeded wholesale distributor replacement cost.
          example: 200.00
        currency:
          type: string
          enum: [USD, EUR, GBP, CAD, AUD]
          default: "USD"
          description: ISO 4217 three-letter currency code.
          example: "USD"
        paypal_auth_id:
          type: string
          description: Verified PayPal payment authorization ID binding the buyer's funds.
          example: "AUTH-89K2M"
        paypal_order_id:
          type: string
          description: Associated PayPal Order ID.
          example: "ORD-SBX-89K2M"
        tick_sequence:
          type: integer
          minimum: 0
          description: Sequential round / tick counter within the 15-second bidding window.
          example: 3
        time_left_seconds:
          type: number
          format: float
          description: Millisecond-precise remaining window before auction closure.
          example: 10.5
        merchant_id:
          type: string
          description: The specific registered merchant identifier receiving this webhook.
          example: "apex"

    BountyEvaluationResponse:
      type: object
      required:
        - status
        - bid_price
        - merchant_margin
      properties:
        bounty_id:
          type: string
          description: Echoed RFQ bounty identifier.
          example: "bty_99d10e82-2f3b-48c0"
        merchant_id:
          type: string
          description: Merchant bot handle responding to the bounty.
          example: "apex"
        status:
          $ref: '#/components/schemas/DecisionStatus'
        bid_price:
          type: number
          format: float
          minimum: 0.01
          description: Counter-bid price submitted by the merchant. Must be <= buyer_cap to be accepted.
          example: 228.00
        merchant_margin:
          type: number
          format: float
          description: "Calculated gross margin percentage: ((bid_price - wholesale_cost) / bid_price) * 100."
          example: 12.3
        reasoning:
          type: string
          description: Transparent rationale displayed in the terminal typewriter thought feed.
          example: "Undercutting SoundWave Direct by $0.50 while protecting 12.3% gross margin above wholesale."
        inventory_units_available:
          type: integer
          minimum: 0
          description: Real-time inventory available at this price point.
          example: 48
        guaranteed_delivery_days:
          type: integer
          minimum: 1
          description: Guaranteed fulfillment timeline in business days.
          example: 2
        carrier_preference:
          type: string
          enum: [FEDEX, UPS, USPS, DHL]
          default: "FEDEX"
          description: Preferred shipping carrier for PayPal tracking registration.
          example: "FEDEX"

    DecisionStatus:
      type: string
      enum:
        - BID
        - LEADING
        - BELOW_FLOOR
        - PASS
        - WINNER_LOCKED
        - UNVERIFIED_FUNDS
      description: |
        - `BID`: Submitting a competitive counter-bid.
        - `LEADING`: Currently the lowest bid in the arena.
        - `BELOW_FLOOR`: Price floor violated; merchant declines to bid lower.
        - `PASS`: Inventory unavailable or margin targets impossible.
        - `WINNER_LOCKED`: Final winning bid selected for PayPal partial capture.
        - `UNVERIFIED_FUNDS`: PayPal authorization missing or invalid.
      example: "BID"

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          description: Machine-readable error code.
          example: "INVALID_PAYLOAD"
        message:
          type: string
          description: Human-readable error description.
          example: "buyer_cap must be a positive float greater than 0.00"
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of error occurrence.
          example: "2026-11-04T03:00:00Z"
