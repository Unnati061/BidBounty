# ==============================================================================
# BidBounty – Render Infrastructure Blueprint (render.yaml)
# Full-Stack Deployment: FastAPI Python Backend + Vite React Static Frontend
# PayPal AI Hackathon & APIMatic Ready
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Autonomous RFQ Backend (Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: bidbounty-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGIN
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. Vite + React + AG Grid Terminal Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: bidbounty-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bidbounty-backend
          property: host
      - key: VITE_PAYPAL_CLIENT_ID
        value: BAAY-TZ5IUiVwZT9k_cLVkDxiMzRK9wEIN8P-cr1tBFYhyzs7mw9gTnMpHEFld4sFxEcLTvqkBD-FedBNg
